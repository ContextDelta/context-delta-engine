name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  test:
    name: Release check on Node ${{ matrix.node-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version:
          - 20
          - 22
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      # Install dependencies (gpt-tokenizer powers exact token counts, which the
      # e2e harness asserts). --ignore-scripts skips the package's "prepare"
      # lifecycle, which is mapped to the Context Delta CLI rather than a build.
      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Run release check
        run: npm run release:check
