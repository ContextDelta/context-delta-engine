name: Context Packet

# Posts a privacy-safe Context Delta packet summary on each PR: the working set
# (paths + why), what was excluded, and the token economics — never raw code.
# Makes the agent's working context a reviewable artifact, like the diff.

on:
  pull_request:

permissions:
  contents: read
  pull-requests: write

jobs:
  context-packet:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Build context packet comment
        id: packet
        run: |
          {
            echo 'body<<CONTEXTDELTA_EOF'
            node scripts/pr-context-comment.mjs "Review the changes in this pull request"
            echo 'CONTEXTDELTA_EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Upsert PR comment
        uses: actions/github-script@v7
        with:
          script: |
            const body = process.env.PACKET_BODY;
            const marker = "<!-- context-delta-packet -->";
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const { data: comments } = await github.rest.issues.listComments({ owner, repo, issue_number });
            const existing = comments.find((c) => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }
        env:
          PACKET_BODY: ${{ steps.packet.outputs.body }}
