<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" role="img" aria-label="Context Delta metrics rollup preview">
  <rect width="1200" height="640" fill="#f6f8fb"/>
  <rect x="54" y="50" width="1092" height="540" rx="18" fill="#ffffff" stroke="#d8e0ea"/>
  <text x="92" y="110" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#0f172a">Team context quality summary <tspan fill="#94a3b8" font-size="15" font-weight="400">(illustrative layout)</tspan></text>
  <text x="92" y="142" font-family="Arial, sans-serif" font-size="15" fill="#5c687a">Example report format with placeholder values, not measured deployment data. Raw code is excluded by default.</text>

  <g transform="translate(92 190)">
    <rect width="230" height="132" rx="12" fill="#f0fdfa" stroke="#99f6e4"/>
    <text x="22" y="38" font-family="Arial, sans-serif" font-size="15" fill="#0f766e">Avg reduction</text>
    <text x="22" y="88" font-family="Arial, sans-serif" font-size="44" font-weight="700" fill="#0f172a">61%</text>
  </g>
  <g transform="translate(348 190)">
    <rect width="230" height="132" rx="12" fill="#eff6ff" stroke="#bfdbfe"/>
    <text x="22" y="38" font-family="Arial, sans-serif" font-size="15" fill="#2563eb">Tokens saved</text>
    <text x="22" y="88" font-family="Arial, sans-serif" font-size="44" font-weight="700" fill="#0f172a">42M</text>
  </g>
  <g transform="translate(604 190)">
    <rect width="230" height="132" rx="12" fill="#fffbeb" stroke="#fde68a"/>
    <text x="22" y="38" font-family="Arial, sans-serif" font-size="15" fill="#b45309">Stale warnings</text>
    <text x="22" y="88" font-family="Arial, sans-serif" font-size="44" font-weight="700" fill="#0f172a">19</text>
  </g>
  <g transform="translate(860 190)">
    <rect width="230" height="132" rx="12" fill="#f8fafc" stroke="#d8e0ea"/>
    <text x="22" y="38" font-family="Arial, sans-serif" font-size="15" fill="#5c687a">Raw code</text>
    <text x="22" y="88" font-family="Arial, sans-serif" font-size="44" font-weight="700" fill="#0f172a">0</text>
  </g>

  <g transform="translate(92 372)">
    <text x="0" y="0" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#0f172a">Packet risk mix</text>
    <rect x="0" y="28" width="450" height="22" rx="11" fill="#e5e7eb"/>
    <rect x="0" y="28" width="330" height="22" rx="11" fill="#0f766e"/>
    <rect x="330" y="28" width="86" height="22" fill="#f59e0b"/>
    <rect x="416" y="28" width="34" height="22" rx="11" fill="#dc2626"/>
    <text x="0" y="82" font-family="Arial, sans-serif" font-size="14" fill="#5c687a">78% low risk, 18% medium, 4% high</text>
  </g>

  <g transform="translate(650 362)" font-family="Arial, sans-serif">
    <text x="0" y="10" font-size="18" font-weight="700" fill="#0f172a">Latest repo signals</text>
    <rect x="0" y="32" width="440" height="54" rx="9" fill="#f8fafc" stroke="#d8e0ea"/>
    <text x="18" y="65" font-size="14" fill="#0f172a">5 packets exceeded budget pressure</text>
    <rect x="0" y="100" width="440" height="54" rx="9" fill="#f8fafc" stroke="#d8e0ea"/>
    <text x="18" y="133" font-size="14" fill="#0f172a">31 repeated context lookups avoided</text>
    <rect x="0" y="168" width="440" height="54" rx="9" fill="#f8fafc" stroke="#d8e0ea"/>
    <text x="18" y="201" font-size="14" fill="#0f172a">12 redactions applied before handoff</text>
  </g>
</svg>
