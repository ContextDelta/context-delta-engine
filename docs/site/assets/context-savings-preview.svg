<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" role="img" aria-label="Context Delta before and after context savings preview">
  <rect width="1200" height="640" fill="#f6f8fb"/>
  <rect x="44" y="44" width="1112" height="552" rx="18" fill="#ffffff" stroke="#d8e0ea"/>
  <text x="84" y="105" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#0f172a">Before and after context</text>
  <text x="84" y="136" font-family="Arial, sans-serif" font-size="15" fill="#5c687a">A task packet replaces noisy prompt stuffing with a focused, reviewable working set.</text>

  <g transform="translate(84 184)">
    <rect width="474" height="318" rx="14" fill="#fff7ed" stroke="#fed7aa"/>
    <text x="28" y="42" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#b45309">Without Context Delta</text>
    <text x="28" y="88" font-family="Arial, sans-serif" font-size="48" font-weight="700" fill="#0f172a">2,493</text>
    <text x="186" y="88" font-family="Arial, sans-serif" font-size="18" fill="#5c687a">est. tokens</text>
    <g font-family="Arial, sans-serif" font-size="16" fill="#5c687a">
      <text x="28" y="136">old auth docs</text>
      <text x="28" y="174">unrelated open files</text>
      <text x="28" y="212">long chat history</text>
      <text x="28" y="250">missing nearest tests</text>
      <text x="28" y="288">hidden prompt assembly</text>
    </g>
    <g stroke="#fed7aa" stroke-width="1">
      <line x1="28" y1="150" x2="430" y2="150"/>
      <line x1="28" y1="188" x2="430" y2="188"/>
      <line x1="28" y1="226" x2="430" y2="226"/>
      <line x1="28" y1="264" x2="430" y2="264"/>
    </g>
  </g>

  <g transform="translate(642 184)">
    <rect width="474" height="318" rx="14" fill="#f0fdfa" stroke="#99f6e4"/>
    <text x="28" y="42" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#0f766e">With Context Delta</text>
    <text x="28" y="88" font-family="Arial, sans-serif" font-size="48" font-weight="700" fill="#0f172a">645</text>
    <text x="124" y="88" font-family="Arial, sans-serif" font-size="18" fill="#5c687a">est. tokens</text>
    <g font-family="Arial, sans-serif" font-size="16" fill="#134e4a">
      <text x="28" y="136">changed auth service</text>
      <text x="28" y="174">relevant spec section</text>
      <text x="28" y="212">security instruction</text>
      <text x="28" y="250">nearest tests included</text>
      <text x="28" y="288">stale docs excluded</text>
    </g>
    <g stroke="#99f6e4" stroke-width="1">
      <line x1="28" y1="150" x2="430" y2="150"/>
      <line x1="28" y1="188" x2="430" y2="188"/>
      <line x1="28" y1="226" x2="430" y2="226"/>
      <line x1="28" y1="264" x2="430" y2="264"/>
    </g>
  </g>

  <g transform="translate(456 520)">
    <rect width="288" height="52" rx="26" fill="#0f766e"/>
    <text x="44" y="34" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#ffffff">~74% context reduction</text>
  </g>
</svg>
